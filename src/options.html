<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitLab Issue/MR Number Pin 设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings-shell">
      <header class="settings-header">
        <p class="eyebrow">GitLab Issue/MR Number Pin</p>
        <h1>设置</h1>
        <p>调整列表、缓存和控件交互偏好。</p>
      </header>
      <form id="settings-form" class="settings-form">
        <fieldset>
          <legend>列表</legend>
          <label>
            <span>默认列表筛选</span>
            <select id="list-filter">
              <option value="all">Issues 和 Merge requests</option>
              <option value="issue">仅 Issues</option>
              <option value="merge-request">仅 Merge requests</option>
            </select>
          </label>
          <label class="check-row">
            <input id="remember-search" type="checkbox">
            <span>记住列表搜索条件</span>
          </label>
          <label>
            <span>缓存有效期（秒）</span>
            <input id="cache-ttl" type="number" min="5" max="300" step="1" inputmode="numeric">
          </label>
          <label>
            <span>每类最多显示数量</span>
            <input id="max-items" type="number" min="1" max="100" step="1" inputmode="numeric">
          </label>
          <label>
            <span>加载模式</span>
            <select id="loading-mode">
              <option value="parallel">并行加载</option>
              <option value="sequential">顺序加载</option>
              <option value="paginated">渐进加载（首批 + 加载更多）</option>
            </select>
          </label>
          <label>
            <span>渐进加载每批数量</span>
            <input id="max-items-batch" type="number" min="1" max="100" step="1" inputmode="numeric">
          </label>
          <label>
            <span>单次请求超时（毫秒）</span>
            <input id="request-timeout" type="number" min="1000" max="60000" step="500" inputmode="numeric">
          </label>
        </fieldset>
        <fieldset>
          <legend>显示与交互</legend>
          <label class="check-row">
            <input id="show-last-refresh" type="checkbox">
            <span>显示最后刷新时间</span>
          </label>
          <label class="check-row">
            <input id="touch-drag" type="checkbox">
            <span>启用触屏拖动控件</span>
          </label>
          <label>
            <span>键盘移动步长（像素）</span>
            <input id="keyboard-step" type="number" min="1" max="50" step="1" inputmode="numeric">
          </label>
        </fieldset>
        <fieldset>
          <legend>实例授权</legend>
          <p class="field-hint">为需要展示 Issue/MR 编号的 GitLab 实例授权。权限按实例精确授予，可随时撤销。</p>
          <ul id="granted-origins" class="granted-origins" aria-label="已授权的 GitLab 实例"></ul>
          <label>
            <span>GitLab 实例地址</span>
            <input id="origin-input" type="url" placeholder="https://gitlab.example.com" inputmode="url">
          </label>
          <div class="origin-actions">
            <button id="grant-origin" type="button" class="secondary">授权实例</button>
          </div>
          <p id="origin-status" class="status" role="status" aria-live="polite"></p>
        </fieldset>
        <div class="settings-actions">
          <button id="reset-settings" type="button" class="secondary">恢复默认值</button>
          <button type="submit" class="primary">保存设置</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="config.js"></script>
    <script src="permissions.js"></script>
    <script src="options.js"></script>
  </body>
</html>
